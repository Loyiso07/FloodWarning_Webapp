<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BridgeGuard - Manage Bridges</title>
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <div class="manage-page">
      <div class="manage-header">
        <span class="logo-text">BRIDGE<span class="accent">GUARD</span></span>
        <a href="admin.html" class="back-link">&larr; Back to Admin</a>
      </div>

      <div class="panel">
        <div class="panel-title">ADD BRIDGE</div>
        <form id="add-bridge-form" class="stacked-form">
          <input
            type="text"
            id="code"
            placeholder="Bridge Code (e.g. BR-002)"
            required
          />
          <input type="text" id="name" placeholder="Bridge Name" required />
          <input type="text" id="location" placeholder="Location" required />
          <input
            type="number"
            step="0.1"
            id="warning_threshold_cm"
            placeholder="Warning Threshold (cm)"
            required
          />
          <input
            type="number"
            step="0.1"
            id="danger_threshold_cm"
            placeholder="Danger Threshold (cm)"
            required
          />
          <input
            type="number"
            step="0.01"
            id="vibration_threshold_g"
            placeholder="Vibration Threshold (g)"
            required
          />
          <button type="submit">Add Bridge</button>
        </form>
        <div id="form-message" class="login-error"></div>
      </div>

      <div class="panel">
        <div class="panel-title">EXISTING BRIDGES</div>
        <div id="bridge-list"></div>
      </div>
    </div>

    <script src="manage-bridge.js"></script>
  </body>
</html>
